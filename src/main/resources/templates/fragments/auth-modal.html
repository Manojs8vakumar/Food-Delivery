<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
  <!-- Auth & Partner Modal Fragment -->
  <div th:fragment="authModal" 
       x-data="{ 
         modalOpen: false, 
         tab: 'login', // login, signup, partner
         email: '',
         password: '',
         name: '',
         restaurantName: '',
         city: 'Bengaluru'
       }" 
       x-init="
         window.openAuthModal = (t) => { tab = t || 'login'; modalOpen = true; };
         window.openPartnerModal = () => { tab = 'partner'; modalOpen = true; };
       "
       x-show="modalOpen" 
       x-cloak
       class="relative z-50">
    
    <!-- Backdrop -->
    <div x-show="modalOpen" 
         x-transition:enter="ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="modalOpen = false" 
         class="fixed inset-0 bg-black/60 backdrop-blur-xs"></div>

    <!-- Modal Box -->
    <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
      <div x-show="modalOpen" 
           x-transition:enter="ease-out duration-300"
           x-transition:enter-start="opacity-0 scale-95"
           x-transition:enter-end="opacity-100 scale-100"
           x-transition:leave="ease-in duration-200"
           x-transition:leave-start="opacity-100 scale-100"
           x-transition:leave-end="opacity-0 scale-95"
           @click.away="modalOpen = false"
           class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <!-- Header -->
        <div class="p-6 bg-gradient-to-r from-rose-600 to-amber-500 text-white relative">
          <button @click="modalOpen = false" class="absolute top-4 right-4 text-white/80 hover:text-white p-1 rounded-full hover:bg-white/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
          <span class="text-xs uppercase font-extrabold tracking-widest text-amber-200">Welcome to Live For Food</span>
          <h3 class="text-2xl font-black mt-1 brand-font" x-text="tab === 'partner' ? 'Partner with Live For Food' : (tab === 'signup' ? 'Create an Account' : 'Welcome Back')"></h3>
          <p class="text-xs text-white/90 mt-1" x-text="tab === 'partner' ? 'Grow your food business with thousands of hungry foodies.' : 'Discover and order from top restaurants in Bengaluru.'"></p>
        </div>

        <!-- Tabs -->
        <div x-show="tab !== 'partner'" class="flex border-b border-gray-200">
          <button @click="tab = 'login'" :class="tab === 'login' ? 'border-b-2 border-rose-600 text-rose-600 font-bold' : 'text-gray-500 font-medium'" class="flex-1 py-3 text-center text-sm transition-colors">
            Log In
          </button>
          <button @click="tab = 'signup'" :class="tab === 'signup' ? 'border-b-2 border-rose-600 text-rose-600 font-bold' : 'text-gray-500 font-medium'" class="flex-1 py-3 text-center text-sm transition-colors">
            Sign Up
          </button>
        </div>

        <!-- Form Body -->
        <div class="p-6 space-y-4">
          
          <!-- Login Form -->
          <div x-show="tab === 'login'" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email or Phone</label>
              <input type="text" x-model="email" placeholder="manoj@example.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Password</label>
              <input type="password" x-model="password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <button @click="modalOpen = false; showToast('Logged in successfully as Manoj Kumar!');" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition-all">
              Sign In
            </button>
            <div class="text-center">
              <span class="text-xs text-gray-500">Quick test: </span>
              <button @click="modalOpen = false; showToast('Demo Guest Login Active!');" class="text-xs text-rose-600 font-bold underline">
                Continue as Demo Guest
              </button>
            </div>
          </div>

          <!-- Signup Form -->
          <div x-show="tab === 'signup'" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Full Name</label>
              <input type="text" x-model="name" placeholder="John Doe" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
              <input type="email" x-model="email" placeholder="john@example.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Create Password</label>
              <input type="password" x-model="password" placeholder="Min. 8 characters" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <button @click="modalOpen = false; showToast('Account created successfully!');" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition-all">
              Create Account
            </button>
          </div>

          <!-- Partner with Us Form -->
          <div x-show="tab === 'partner'" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Restaurant Name</label>
              <input type="text" x-model="restaurantName" placeholder="e.g. Royal Biryani House" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">City & Area</label>
              <input type="text" x-model="city" placeholder="Indiranagar, Bengaluru" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Owner Contact Number</label>
              <input type="tel" placeholder="+91 98765 00000" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
            </div>
            <button @click="modalOpen = false; showToast('Partner application received! Our team will contact you in 24 hours.');" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-gray-900 font-extrabold rounded-xl shadow-md transition-all">
              Submit Partnership Request
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>
</body>
</html>
