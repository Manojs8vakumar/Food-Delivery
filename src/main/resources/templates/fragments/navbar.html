<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
  <!-- Global Navbar Fragment -->
  <nav th:fragment="navbar(isTransparent)" 
       x-data="{ 
         mobileMenuOpen: false, 
         cartCount: 0,
         scrolled: false,
         cityDropdown: false,
         selectedCity: 'Bengaluru'
       }" 
       x-init="
         window.addEventListener('scroll', () => { scrolled = window.scrollY > 30 });
         window.addEventListener('cart-updated', (e) => { cartCount = e.detail.count });
         if (window.CartStore) { cartCount = CartStore.getTotalCount(); }
       "
       :class="{
         'bg-white text-gray-900 shadow-sm border-b border-gray-100': (![(${isTransparent})] || scrolled),
         'bg-transparent text-white': ([(${isTransparent})] && !scrolled)
       }"
       class="sticky top-0 z-40 w-full transition-all duration-300">
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Left: Brand Logo & City Picker -->
        <div class="flex items-center space-x-6">
          <a href="/" class="flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-amber-500 flex items-center justify-center text-white shadow-md shadow-rose-500/20 group-hover:scale-105 transition-transform">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
              </svg>
            </div>
            <div>
              <span class="text-2xl font-black tracking-tight brand-font block leading-none">
                Live <span class="text-rose-500">For Food</span>
              </span>
              <span class="text-[10px] uppercase font-bold tracking-widest opacity-80">Food & Drinks Delivery</span>
            </div>
          </a>

          <!-- City Selector Badge -->
          <div class="hidden md:block relative" @click.away="cityDropdown = false">
            <button type="button" 
                    @click.stop="cityDropdown = !cityDropdown" 
                    :class="(![(${isTransparent})] || scrolled) ? 'bg-gray-100 text-gray-700 hover:bg-gray-200' : 'bg-white/15 text-white hover:bg-white/25'"
                    class="px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer">
              <svg class="w-3.5 h-3.5 text-rose-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
              </svg>
              <span x-text="selectedCity">Bengaluru</span>
              <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div x-show="cityDropdown" 
                 x-cloak
                 x-transition
                 class="absolute left-0 mt-2 w-48 bg-white text-gray-900 rounded-xl shadow-xl border border-gray-100 py-1 z-50 text-sm">
              <button type="button" @click="selectedCity = 'Bengaluru'; cityDropdown = false; window.dispatchEvent(new CustomEvent('city-changed', {detail: 'Bengaluru'}))" class="w-full text-left px-4 py-2 hover:bg-rose-50 hover:text-rose-600 font-medium">Bengaluru</button>
              <button type="button" @click="selectedCity = 'Mumbai'; cityDropdown = false; window.dispatchEvent(new CustomEvent('city-changed', {detail: 'Mumbai'}))" class="w-full text-left px-4 py-2 hover:bg-rose-50 hover:text-rose-600 font-medium">Mumbai</button>
              <button type="button" @click="selectedCity = 'Delhi NCR'; cityDropdown = false; window.dispatchEvent(new CustomEvent('city-changed', {detail: 'Delhi NCR'}))" class="w-full text-left px-4 py-2 hover:bg-rose-50 hover:text-rose-600 font-medium">Delhi NCR</button>
              <button type="button" @click="selectedCity = 'Hyderabad'; cityDropdown = false; window.dispatchEvent(new CustomEvent('city-changed', {detail: 'Hyderabad'}))" class="w-full text-left px-4 py-2 hover:bg-rose-50 hover:text-rose-600 font-medium">Hyderabad</button>
            </div>
          </div>
        </div>

        <!-- Right: Navigation Links & Actions -->
        <div class="hidden lg:flex items-center space-x-7 text-sm font-semibold">
          <a href="#" @click.prevent="openPartnerModal()" class="hover:text-rose-500 transition-colors">Investor Relations</a>
          <a href="#" @click.prevent="openPartnerModal()" class="hover:text-rose-500 transition-colors">Add restaurant</a>
          <a href="/orders" class="hover:text-rose-500 transition-colors flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            My Orders
          </a>
          <a href="#" @click.prevent="openAuthModal('login')" class="hover:text-rose-500 transition-colors">Log in</a>
          <a href="#" @click.prevent="openAuthModal('signup')" class="hover:text-rose-500 transition-colors">Sign up</a>

          <!-- Cart Drawer Trigger Button -->
          <button @click="$dispatch('open-cart')" 
                  class="relative flex items-center gap-2 bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-full font-bold shadow-md shadow-rose-600/30 transition-all hover:scale-105 active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span>Cart</span>
            <span x-show="cartCount > 0" 
                  x-text="cartCount" 
                  class="ml-1 bg-white text-rose-600 text-xs px-2 py-0.5 rounded-full font-extrabold shadow-sm">
            </span>
          </button>
        </div>

        <!-- Mobile Hamburger & Mobile Cart -->
        <div class="flex items-center gap-3 lg:hidden">
          <button @click="$dispatch('open-cart')" class="relative p-2 rounded-lg bg-rose-600 text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span x-show="cartCount > 0" x-text="cartCount" class="absolute -top-1 -right-1 bg-amber-400 text-gray-900 text-[10px] w-4 h-4 rounded-full font-bold flex items-center justify-center"></span>
          </button>

          <button @click="mobileMenuOpen = !mobileMenuOpen" class="p-2 rounded-lg hover:bg-black/10 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
              <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div x-show="mobileMenuOpen" 
         @click.away="mobileMenuOpen = false" 
         x-transition
         class="lg:hidden bg-white text-gray-900 border-t border-gray-100 shadow-xl px-4 pt-3 pb-6 space-y-3">
      <a href="/?mode=delivery" class="block py-2 text-base font-semibold hover:text-rose-600">Order Online</a>
      <a href="/?mode=dining" class="block py-2 text-base font-semibold hover:text-rose-600">Dining Out</a>
      <a href="/?mode=nightlife" class="block py-2 text-base font-semibold hover:text-rose-600">Nightlife & Clubs</a>
      <a href="/orders" class="block py-2 text-base font-semibold hover:text-rose-600">My Orders</a>
      <hr class="border-gray-100 my-2">
      <div class="flex gap-3 pt-2">
        <button @click="openAuthModal('login')" class="flex-1 py-2 text-center text-sm font-bold border border-gray-300 rounded-lg">Log in</button>
        <button @click="openAuthModal('signup')" class="flex-1 py-2 text-center text-sm font-bold bg-rose-600 text-white rounded-lg">Sign up</button>
      </div>
    </div>
  </nav>
</body>
</html>
